DEFAULT: 
  camera_config: &default_camera_settings # See camera_variables.md documentation
      # Image format settings
      Width: 3548
      Height: 3548
      OffsetX: 0 
      OffsetY: 4
      BslColorSpace: "sRGB"
      PixelFormat: "BayerRG8"
      LUTEnable: True
      # Image Capture settings
      ExposureTime: 15000.0
      Gain: 0.0
      gamma: 1.0
      # Video settings
      AcquisitionFrameRateEnable: True
      AcquisitionFrameRate: 1.0
      # Auto settings
      AutoTargetBrightness: 0.5   # Mellem 0.0 og 1.0
      AutoFunction: "MinimizeGain" # "MinimizeGain", eller "MinimizeExposureTime"
      ExposureAuto: "Continuous"   # 'Off', 'Once', 'Continuous'
      AutoExposureTimeLowerLimit: 1.0
      AutoExposureTimeUpperLimit: 100000.0
      GainAuto: "Off"       # Off,' 'Once', 'Continuous'
      AutoGainLowerLimit: 0
      AutoGainUpperLimit: 24
      BalanceWhiteAuto: "Off"   # Off,' 'Once', 'Continuous'
  light_config: &default_light_settings
    led1: 100 # Strength in 8bit values (0-255)
    led2: 100 # Strength in 8bit values (0-255)
    led3: 100 # Strength in 8bit values (0-255

network:
  camera_switch_mac: "58:d6:1f:7c:65:03"

# Named camera configuration presets
camera_configs:
  default:
    <<: *default_camera_settings

  40pAutoExp:
    <<: *default_camera_settings
    AutoTargetBrightness: 0.4

  30pAutoExp:
    <<: *default_camera_settings
    AutoTargetBrightness: 0.3

  20pAutoExp:
    <<: *default_camera_settings
    AutoTargetBrightness: 0.2

# Named lighting configuration presets
light_configs:
  default:
    <<: *default_light_settings

  lightsOff: 
